<!doctype html>
<html lang="en">
	<meta charset="utf-8" />
	<title>Pops</title>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
		canvas {
			display: block;
			width: 960px;
			height: 540px;
		}
	</style>
	<script>
		// a fixed-step clock, so the run advances by frames and not by the capture's speed
		let __t = 0;
		performance.now = () => __t;
		window.__clock = { add: (ms) => (__t += ms) };
	</script>
	<canvas></canvas>
	<script type="module" src="./pops.ts"></script>
</html>
