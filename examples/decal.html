<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>narcissus decal</title>
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				font:
					13px system-ui,
					sans-serif;
			}
			narcissus-viewer {
				height: 100%;
			}
			#panel {
				position: fixed;
				top: 8px;
				left: 8px;
				display: grid;
				gap: 6px;
				width: 220px;
				padding: 10px;
				border-radius: 6px;
				background: #fffe;
			}
		</style>
	</head>
	<body>
		<!-- ?src=<url of a world.json> shows another world -->
		<narcissus-viewer
			src="../fixtures/scene/world.json"
			camera="723031,6177031,,0,-45,45"
			aria-label="the world"
		>
			<p>This browser cannot show the world.</p>
		</narcissus-viewer>
		<div id="panel">
			<label><input id="place" type="checkbox" /> a click places the decal</label>
			<label>heading <input id="heading" type="range" min="0" max="59" value="10" /></label>
			<label
				>radius <input id="radius" type="range" min="0.5" max="12" step="0.1" value="6"
			/></label>
			<span>under the pointer: <output id="under">-</output></span>
		</div>
		<script type="module">
			// from a clone: pnpm build, then serve the repository root. on a site, point this at the package's dist
			import '../dist/element/index.js';

			const viewer = document.querySelector('narcissus-viewer');
			const src = new URLSearchParams(location.search).get('src');
			if (src) viewer.setAttribute('src', src);
			const $ = (id) => document.getElementById(id);
			const TOKENS = { 1: 'the ground', 2: 'the decal' };

			// a hexagon over the surfaces below it, painted inside each splat it crosses: the shade
			// turns its corners into the splat's source coordinates, and the sample hook takes the
			// share of the splat's light that comes from inside it at each pixel
			let centre = null;
			const decal = {
				name: 'decal',
				uniforms: 4,
				sample: true,
				wgsl: `
// u[0] to u[2]: the hexagon's corners as e n pairs in the floating-origin frame; u[3]: its colour
fn decal(s: ptr<function, Splat>, u: array<vec4f, 4>) {
	(*s).token = 1u;
	// the splat's surface: its two widest axes
	let k = (*s).scale;
	let thin = select(select(2u, 1u, k.y < k.z), 0u, k.x < k.y && k.x < k.z);
	let a = select(0u, 1u, thin == 0u);
	let b = select(2u, 1u, thin == 2u);
	let corners = array<vec2f, 6>(u[0].xy, u[0].zw, u[1].xy, u[1].zw, u[2].xy, u[2].zw);
	var q: array<vec2f, 6>;
	var lo = vec2f(1e9);
	var hi = vec2f(-1e9);
	var area = 0.0;
	for (var i = 0u; i < 6u; i++) {
		let z = source(s, vec3f(corners[i], (*s).position.z));
		q[i] = vec2f(z[a], z[b]);
		lo = min(lo, q[i]);
		hi = max(hi, q[i]);
	}
	// 4 sigmas off the splat on any side, the hexagon leaves it as it is
	if (any(hi < vec2f(-4.0)) || any(lo > vec2f(4.0))) {
		return;
	}
	for (var i = 0u; i < 6u; i++) {
		let next = q[(i + 1u) % 6u];
		area += q[i].x * next.y - next.x * q[i].y;
	}
	var data: array<u32, 8>;
	for (var i = 0u; i < 6u; i++) {
		// counter-clockwise, as polygon() takes it
		data[i] = pack2x16float(q[select(i, 5u - i, area < 0.0)]);
	}
	data[6] = a | (b << 8u);
	sample_request(s, data);
}

fn decal_sample(c: Sample, u: array<vec4f, 4>) -> Sampled {
	let a = c.data[6] & 0xffu;
	let b = c.data[6] >> 8u;
	let p = posterior(c.coverage, c.offset);
	let q = marginal(p, a, b);
	var hexagon: array<vec2f, 12>;
	for (var i = 0u; i < 6u; i++) {
		hexagon[i] = unpack2x16float(c.data[i]);
	}
	var all: array<vec2f, 12>;
	all[0] = vec2f(-1e3, -1e3);
	all[1] = vec2f(1e3, -1e3);
	all[2] = vec2f(1e3, 1e3);
	all[3] = vec2f(-1e3, 1e3);
	// a clip cuts both first: the share is of the light the clip keeps
	let n = clip_polygon(p, a, b, c.clip, &hexagon, 6u);
	let m = clip_polygon(p, a, b, c.clip, &all, 4u);
	let share = polygon(q, hexagon, n) / max(polygon(q, all, m), 1e-30);
	let colour = mix(c.colour, u[3].rgb, share * u[3].a);
	return Sampled(vec4f(colour * c.alpha, c.alpha), select(1u, 2u, share >= 0.5));
}`,
				update: (frame, out) => {
					if (!centre) return;
					const [e, n] = [centre[0] - frame.origin[0], centre[1] - frame.origin[1]];
					const radius = $('radius').valueAsNumber;
					const heading = ($('heading').valueAsNumber * Math.PI) / 180;
					for (let k = 0; k < 6; k++) {
						const angle = heading + (k * Math.PI) / 3;
						out.set([e + radius * Math.cos(angle), n + radius * Math.sin(angle)], 2 * k);
					}
					out.set([0.95, 0.2, 0.45, 0.9], 12);
				}
			};

			viewer.addEventListener('start', () => {
				const engine = viewer.engine;
				// the scene is a few metres tall: down to 2 m above it, not 50 m
				viewer.controls.limits = { ...viewer.controls.limits, floor: 0, clearance: 2 };
				engine.use((host) => host.shade(decal));
				for (const id of ['heading', 'radius']) $(id).oninput = () => engine.requestFrame();
				viewer.addEventListener(
					'pointerdown',
					async (event) => {
						if (!$('place').checked || event.button !== 0) return;
						event.preventDefault();
						const hit = await engine.pick(event.offsetX, event.offsetY);
						if (hit) centre = hit.point;
						engine.requestFrame();
					},
					{ capture: true }
				);
				let picking = false;
				viewer.addEventListener('pointermove', async (event) => {
					if (picking) return;
					picking = true;
					const hit = await engine.pick(event.offsetX, event.offsetY);
					picking = false;
					$('under').value = hit ? TOKENS[hit.token] : '-';
				});
			});
			viewer.addEventListener(
				'ready',
				() => {
					const { e, n, h } = viewer.controls.pose;
					centre = [e, n, h];
					viewer.engine.requestFrame();
				},
				{ once: true }
			);
			viewer.addEventListener('error', (event) => console.error(event.detail));
		</script>
	</body>
</html>
